resolver: lts-22.43
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  # warp-quic is left out here: it needs http3, which needs a quic that
  # wants tls 2.4 and crypton 2.1, and this snapshot is on tls 2.1 and
  # crypton 1.0.
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
  zlib:
    bundled-c-zlib: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - crypton-1.0.4
  - crypto-token-0.1.2
  - crypton-x509-store-1.6.11
  - crypton-x509-validation-1.6.13
  - ech-config-0.0.1
  - hpke-0.0.0
  - http-semantics-0.4.0
  # TEMPORARY: http2 with confTimeout (kazu-yamamoto/http2#213), until it
  # is released. Revert to a Hackage version before merging.
  - git: https://github.com/kazu-yamamoto/http2
    commit: 40d14d4b49dd1e0252d2226b40a31f9b073ddd38
  - network-3.2.9.0
  - network-control-0.1.7
  - network-udp-0.0.0
  - random-1.3.1
  - sockaddr-0.0.1
  - tls-2.1.11
  - tls-session-manager-0.0.7
  - uuid-types-1.0.6
  - websockets-0.13.0.0
  - zlib-0.7.1.0
  - zlib-clib-1.3.1
allow-newer: true
allow-newer-deps:
  - http2
  - http3
