resolver: nightly
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  # warp-quic is left out here: it needs http3, which needs a quic that
  # wants crypton 2.1, and this snapshot is on crypton 1.1.
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  # TEMPORARY: http2 with confTimeout (kazu-yamamoto/http2#213), until it
  # is released. Revert to a Hackage version before merging.
  - git: https://github.com/kazu-yamamoto/http2
    commit: 40d14d4b49dd1e0252d2226b40a31f9b073ddd38
allow-newer: true
allow-newer-deps:
  - http2
  - http3
